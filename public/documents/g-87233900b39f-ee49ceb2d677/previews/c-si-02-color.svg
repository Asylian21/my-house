17 500–21 000 mm</text><text x="706" y="58" font-size="3.2" class="bold" text-anchor="start">PARCELA 6012/26. Uličný aj pravý KOLMÝ odstup 3 000 mm. Jediný</text><text x="706" y="62.8" font-size="3.2" class="bold" text-anchor="start">súradnicový rámec C/B/B.</text><text x="706" y="116" font-size="3" class="" text-anchor="start">Katastrálna hranica a požadované osadenie nie sú geodetické vytýčenie.</text><text x="706" y="120.5" font-size="3" class="" text-anchor="start">Pred stavbou overiť hranice a výškopis.</text><rect x="12" y="260" width="450" height="10" class="thin" fill="#efefef"/><text x="14" y="266" font-size="2.7" class="bold" text-anchor="start">Bod</text><text x="77" y="266" font-size="2.7" class="bold" text-anchor="start">X [mm]</text><text x="203" y="266" font-size="2.7" class="bold" text-anchor="start">Y [mm]</text><text x="329" y="266" font-size="2.7" class="bold" text-anchor="start">Prvok</text><rect x="12" y="270" width="450" height="10" class="rule" fill="white"/><text x="14" y="274.5" font-size="2.6" class="" text-anchor="start">H1</text><text x="77" y="274.5" font-size="2.6" class="" text-anchor="start">6 440</text><text x="203" y="274.5" font-size="2.6" class="" text-anchor="start">3 000</text><text x="329" y="274.5" font-size="2.6" class="" text-anchor="start">vonkajšie líce</text><rect x="12" y="280" width="450" height="10" class="rule" fill="white"/><text x="14" y="284.5" font-size="2.6" class="" text-anchor="start">H2</text><text x="77" y="284.5" font-size="2.6" class="" text-anchor="start">28 040</text><text x="203" y="284.5" font-size="2.6" class="" text-anchor="start">3 000</text><text x="329" y="284.5" font-size="2.6" class="" text-anchor="start">vonkajšie líce</text><rect x="12" y="290" width="450" height="10" class="rule" fill="white"/><text x="14" y="294.5" font-size="2.6" class="" text-anchor="start">H3</text><text x="77" y="294.5" font-size="2.6" class="" text-anchor="start">28 040</text><text x="203" y="294.5" font-size="2.6" class="" text-anchor="start">22 035</text><text x="329" y="294.5" font-size="2.6" class="" text-anchor="start">vonkajšie líce</text><rect x="12" y="300" width="450" height="10" class="rule" fill="white"/><text x="14" y="304.5" font-size="2.6" class="" text-anchor="start">H4</text><text x="77" y="304.5" font-size="2.6" class="" text-anchor="start">21 040</text><text x="203" y="304.5" font-size="2.6" class="" text-anchor="start">22 035</text><text x="329" y="304.5" font-size="2.6" class="" text-anchor="start">vonkajšie líce</text><rect x="12" y="310" width="450" height="10" class="rule" fill="white"/><text x="14" y="314.5" font-size="2.6" class="" text-anchor="start">H5</text><text x="77" y="314.5" font-size="2.6" class="" text-anchor="start">21 040</text><text x="203" y="314.5" font-size="2.6" class="" text-anchor="start">11 200</text><text x="329" y="314.5" font-size="2.6" class="" text-anchor="start">vonkajšie líce</text><rect x="12" y="320" width="450" height="10" class="rule" fill="white"/><text x="14" y="324.5" font-size="2.6" class="" text-anchor="start">H6</text><text x="77" y="324.5" font-size="2.6" class="" text-anchor="start">6 440</text><text x="203" y="324.5" font-size="2.6" class="" text-anchor="start">11 200</text><text x="329" y="324.5" font-size="2.6" class="" text-anchor="start">vonkajšie líce</text><line x1="12" y1="260" x2="12" y2="330" class="rule" /><line x1="75" y1="260" x2="75" y2="330" class="rule" /><line x1="201" y1="260" x2="201" y2="330" class="rule" /><line x1="327" y1="260" x2="327" y2="330" class="rule" /><line x1="462" y1="260" x2="462" y2="330" class="rule" /><text x="490" y="268" font-size="3" class="" text-anchor="start">Počiatok lokálneho rámca S-JTSK [mm]: X -606 705 098,323, Y -1 202 056 601,691. Posun oproti C3: 77,913 mm v X.</text><text x="490" y="305" font-size="3" class="" text-anchor="start">R0 = 184,200 m: najvyšší bod ulice pri pracovni podľa stavebníka. Spodná uličná rímsa má podmienený limit 188,700 m. Presné XY bodu, Bpv a rozdiel ΔFFL podlahy k R0 treba potvrdiť; bod sa preto</text><text x="490" y="309.5" font-size="3" class="" text-anchor="start">neumiestňuje odhadom.</text><text x="490" y="362" font-size="3" class="" text-anchor="start">Štúdia Z7/Z22: pre samostatný dom uličná čiara 3 m. Overiť 7 m medzi obytnými domami, plochy zelene, spevnenie a dve parkovacie miesta. Podrobné zdroje a otvorené kontroly: UP-01.</text><text x="12" y="370" font-size="3.2" class="" text-anchor="start">Voda a odpad sa vedú nad nosnou doskou. Vývody a ich úrovne cez obvodovú konštrukciu musia byť určené v novom návrhu; žiadne dodatočné vŕtanie dosky.</text><text x="12" y="411" font-size="3" class="" text-anchor="start">Vytyčenie stupňov: spoločná os X 24 540 mm; prvé čelo Y 22 035 mm = os 6. Krajné líca X 23 340 / 25 740 mm. Odstupy od vonkajších líc krídla: 2 300 mm / 2 300 mm.</text><text x="12" y="492" font-size="2.7" class="" text-anchor="start">KONTROLA TLAČE 100 % · 1 000 mm = 20 mm na papieri</text><line x1="12" y1="498" x2="32" y2="498" class="heavy" /><line x1="12" y1="495" x2="12" y2="501" class="thin" /><line x1="32" y1="495" x2="32" y2="501" class="thin" /><text x="39" y="499" font-size="2.7" class="" text-anchor="start">1 : 50 · vypnúť „prispôsobiť strane“</text><line x1="12" y1="513" x2="829" y2="513" class="heavy" /><text x="12" y="523" font-size="6" class="bold" text-anchor="start">NOVOSTAVBA RD BŘEZÍ U MIKULOVA</text><text x="12" y="531" font-size="3.6" class="bold" text-anchor="start">PARCELA 6012/26 · HLAVNÝ NÁVRH C / B / B</text><text x="12" y="541" font-size="5" class="bold" text-anchor="start">Situácia osadenia · záhrada</text><text x="12" y="550" font-size="2.6" class="" text-anchor="start">R0 = 184,200 m · M0 = PODLAHA MODELU · ΔFFL = M0 − R0 ZATIAĽ NEURČENÉ</text><text x="12" y="559" font-size="2.8" class="" text-anchor="start">Rozdelenie na dva nadväzujúce listy zachováva 1:50. Hranice a výškové osadenie treba geodeticky overiť. R05 zostáva otvorený.</text><line x1="500" y1="513" x2="500" y2="581" class="thin" /><text x="509" y="522" font-size="2.5" class="muted" text-anchor="start">STAV</text><text x="509" y="530" font-size="4.8" class="bold" text-anchor="start">NEVYDANÉ NA REALIZÁCIU</text><text x="509" y="538" font-size="2.8" class="" text-anchor="start">Chýbajúci návrh sa nesmie nahradiť mierkou výkresu.</text><text x="509" y="549" font-size="2.8" class="" text-anchor="start">VYPRACOVAL: digitálne dvojča · bez autorizačnej pečiatky</text><text x="509" y="557" font-size="2.8" class="" text-anchor="start">DÁTUM 2026-09-14   FORMÁT A1 841 × 594 mm   MIERKA 1 : 50</text><text x="509" y="565" font-size="2.4" class="" text-anchor="start">ZDROJ 6cd4bc82841b · úplné odtlačky v model-snapshot.json</text><text x="829" y="578" font-size="6" class="bold" text-anchor="end">C.SI-02</text></svg>