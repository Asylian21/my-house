re / 1.12</text><rect x="12" y="293" width="817" height="14" class="rule" fill="white"/><text x="14" y="297.5" font-size="2.6" class="" text-anchor="start">O11 / svetlík nad O8</text><text x="210.07999999999998" y="297.5" font-size="2.6" class="" text-anchor="start">NN2 · Y 19 535</text><text x="348.97" y="297.5" font-size="2.6" class="" text-anchor="start">X 22 040 → 24 040</text><text x="471.52000000000004" y="297.5" font-size="2.6" class="" text-anchor="start">2 000 × 1 419,65 / 3 050</text><text x="602.24" y="297.5" font-size="2.6" class="" text-anchor="start">pevné / neprechodné</text><text x="708.45" y="297.5" font-size="2.6" class="" text-anchor="start">trojuholník / 1.03</text><line x1="12" y1="59" x2="12" y2="307" class="rule" /><line x1="208.07999999999998" y1="59" x2="208.07999999999998" y2="307" class="rule" /><line x1="346.97" y1="59" x2="346.97" y2="307" class="rule" /><line x1="469.52000000000004" y1="59" x2="469.52000000000004" y2="307" class="rule" /><line x1="600.24" y1="59" x2="600.24" y2="307" class="rule" /><line x1="706.45" y1="59" x2="706.45" y2="307" class="rule" /><line x1="829" y1="59" x2="829" y2="307" class="rule" /><text x="12" y="320" font-size="3.2" class="bold" text-anchor="start">Uvedené rozmery patria otvorom v modeli. Výrobný rozmer rámu, montážna škára, profily, prah, zasklenie, kovanie a požadované vlastnosti zatiaľ nie sú špecifikované. Údaje označené „neurčené“ nemožno odvodiť od oka.</text><text x="12" y="347" font-size="3" class="" text-anchor="start">O11 je doplnený kód svetlíka nad rovinou pôdorysného rezu. Trojuholník nie je obdĺžnik: vrcholy X/Z [mm] (22040;3050), (24040;3050), (24040;4469,649650). Rozmer z geometrie rendereru; výrobná šablóna a osadenie sa musia dopracovať.</text><text x="12" y="492" font-size="2.7" class="" text-anchor="start">KONTROLA TLAČE 100 % · 1 000 mm = 20 mm na papieri</text><line x1="12" y1="498" x2="32" y2="498" class="heavy" /><line x1="12" y1="495" x2="12" y2="501" class="thin" /><line x1="32" y1="495" x2="32" y2="501" class="thin" /><text x="39" y="499" font-size="2.7" class="" text-anchor="start">1 : 50 · vypnúť „prispôsobiť strane“</text><line x1="12" y1="513" x2="829" y2="513" class="heavy" /><text x="12" y="523" font-size="6" class="bold" text-anchor="start">NOVOSTAVBA RD BŘEZÍ U MIKULOVA</text><text x="12" y="531" font-size="3.6" class="bold" text-anchor="start">PARCELA 6012/26 · HLAVNÝ NÁVRH C / B / B</text><text x="12" y="541" font-size="5" class="bold" text-anchor="start">Výpis okien a vonkajších dverí</text><text x="12" y="550" font-size="2.6" class="" text-anchor="start">R0 = 184,200 m · M0 = PODLAHA MODELU · ΔFFL = M0 − R0 ZATIAĽ NEURČENÉ</text><text x="12" y="559" font-size="2.8" class="" text-anchor="start">R09: modelový výpis je koordinovaný s pôdorysom, výrobná špecifikácia nie je uzavretá. O11 pridáva chýbajúci horný svetlík.</text><line x1="500" y1="513" x2="500" y2="581" class="thin" /><text x="509" y="522" font-size="2.5" class="muted" text-anchor="start">STAV</text><text x="509" y="530" font-size="4.8" class="bold" text-anchor="start">NEVYDANÉ NA REALIZÁCIU</text><text x="509" y="538" font-size="2.8" class="" text-anchor="start">Chýbajúci návrh sa nesmie nahradiť mierkou výkresu.</text><text x="509" y="549" font-size="2.8" class="" text-anchor="start">VYPRACOVAL: digitálne dvojča · bez autorizačnej pečiatky</text><text x="509" y="557" font-size="2.8" class="" text-anchor="start">DÁTUM 2026-09-14   FORMÁT A1 841 × 594 mm   MIERKA tabuľka</text><text x="509" y="565" font-size="2.4" class="" text-anchor="start">ZDROJ 6cd4bc82841b · úplné odtlačky v model-snapshot.json</text><text x="829" y="578" font-size="6" class="bold" text-anchor="end">D1.1.OT-01</text></svg>