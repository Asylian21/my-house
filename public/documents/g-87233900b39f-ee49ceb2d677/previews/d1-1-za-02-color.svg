<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 841 594" width="841mm" height="594mm" role="img" aria-label="D1.1.ZA-02 Monolitické založenie · rozmery a väzby"><style><![CDATA[@page{size:841mm 594mm;margin:0}*{box-sizing:border-box}html,body{margin:0;padding:0;background:#bbb;font-family:Arial,Helvetica,sans-serif}.page{width:841mm;height:594mm;overflow:hidden;break-after:page;page-break-after:always;background:white;margin:0}.page:last-child{break-after:auto;page-break-after:auto}.page>svg{display:block;width:841mm;height:594mm}svg text{font-family:Arial,Helvetica,sans-serif;fill:black}.bold{font-weight:700}.muted{fill:#555}.thin{stroke:black;stroke-width:.18}.medium{stroke:black;stroke-width:.35}.heavy{stroke:black;stroke-width:.65}.hair{stroke:#888;stroke-width:.10}.rule{stroke:#aaa;stroke-width:.13}.dim{stroke:#e30613;stroke-width:.18}.dim.halo{stroke:white;stroke-width:1.2;paint-order:stroke}.dim text,text.dim{fill:#e30613;stroke:none}.extension{stroke:#e30613;stroke-width:.1}.axis{stroke:#555;stroke-width:.13;stroke-dasharray:5 1 1 1}.datum{stroke:#555;stroke-width:.2;stroke-dasharray:6 1 1 1}.unknown{stroke:black;stroke-width:.5;stroke-dasharray:4 2}.boundary{stroke:#c2129b;stroke-width:.4;stroke-dasharray:5 1 1 1}.cutline{stroke:black;stroke-width:.5;stroke-dasharray:8 1.5 1 1.5}.halo{paint-order:stroke;stroke:white;stroke-width:1.4;stroke-linejoin:round}svg{print-color-adjust:exact;-webkit-print-color-adjust:exact}@media screen{.page{margin:12px auto;box-shadow:0 2px 10px #666}}
.xs-doors .fp-door path{fill:none;stroke:#000;stroke-width:15}.xs-doors .fp-door path+path{stroke-width:6;stroke-dasharray:none}.xs-doors .fp-door-gap{fill:#fff;stroke:none}.xs-doors .fp-sliding path{stroke:#000}text{font-family:"Helvetica Neue", Helvetica, Arial, sans-serif}]]></style><defs>
