  </defs><rect width="841" height="594" fill="white"/><rect x="5" y="5" width="831" height="584" class="thin" fill="none"/><text x="12" y="19" font-size="3.6" class="bold" text-anchor="start">D1.1.ZA-02</text><text x="12" y="30" font-size="6" class="bold" text-anchor="start">Monolitické založenie · rozmery a väzby</text><text x="829" y="19" font-size="3" class="" text-anchor="end">C / B / B · 14. 09. 2026</text><line x1="12" y1="36" x2="829" y2="36" class="thin" /><text x="12" y="50" font-size="4" class="bold" text-anchor="start">MONOLIT DO ODNÍMATEĽNÉHO DEBNENIA · ZADANIE STAVEBNÍKA</text><text x="12" y="62" font-size="3.3" class="" text-anchor="start">Horný pás 350 × 600 mm je zadaný rozmer. Podľa doplnenia stavebníka je doska vyliata aj s lodžiou a krytou terasou. Líca, výšky a výstuž treba zamerať; nepoužíva sa stratené debnenie.</text><text x="22" y="91" font-size="3.5" class="bold" text-anchor="start">Z1 · HORNÝ OBVODOVÝ MONOLIT · 1 : 10</text><rect x="90" y="114" width="35" height="60" class="heavy" fill="url(#concrete)"/><line x1="90" y1="114" x2="90" y2="107" class="extension" /><line x1="125" y1="114" x2="125" y2="107" class="extension" /><line x1="90" y1="105" x2="125" y2="105" class="dim" /><line x1="89" y1="106" x2="91" y2="104" class="dim" /><line x1="124" y1="106" x2="126" y2="104" class="dim" /><text x="107.5" y="103.4" font-size="2.6" class="dim halo" text-anchor="middle">350</text><line x1="90" y1="114" x2="78" y2="114" class="extension" /><line x1="90" y1="174" x2="78" y2="174" class="extension" /><line x1="76" y1="114" x2="76" y2="174" class="dim" /><line x1="75" y1="115" x2="77" y2="113" class="dim" /><line x1="75" y1="175" x2="77" y2="173" class="dim" /><g transform="translate(74.3 144) rotate(-90)"><text x="0" y="0" font-size="2.6" class="dim halo" text-anchor="middle">600</text></g><line x1="50" y1="174" x2="210" y2="174" class="datum" /><text x="145" y="170" font-size="2.9" class="" text-anchor="start">Pracovná škára k staršej betonáži</text><polygon points="65,174 150,174 150,198 134,194 120,198 86,194 65,198" class="thin" fill="url(#concrete)"/><text x="22" y="220" font-size="3" class="" text-anchor="start">Spodný pás: 600 mm v zemi podľa stavebníka.</text><text x="22" y="227" font-size="3" class="" text-anchor="start">Šírka, spodok a horné líce voči R0 zatiaľ nezamerané.</text><text x="22" y="234" font-size="2.8" class="bold" text-anchor="start">Prerušený obrys spodného pásu neurčuje jeho šírku ani výšku.</text><text x="167" y="113" font-size="3" class="" text-anchor="start">Líca horného pásu voči nosnému murivu sa určia až po zameraní. Na výkrese preto nie je predpísané centrovanie muriva ani excentricita.</text><text x="167" y="141" font-size="3" class="" text-anchor="start">Zvislé prúty z fotografie: priemer, počet, rozstup, krytie a zakotvenie nie sú doložené. Existujúcu trhlinu skontrolovať na mieste pred</text><text x="167" y="145.5" font-size="3" class="" text-anchor="start">nadbetónovaním dotknutého úseku.</text><text x="432" y="91" font-size="3.5" class="bold" text-anchor="start">D1 · NOSNÁ DOSKA A INŠTALÁCIE · 1 : 10</text><line x1="460" y1="119" x2="780" y2="119" class="heavy" /><line x1="460" y1="134" x2="780" y2="134" class="unknown" /><line x1="460" y1="139" x2="780" y2="139" class="unknown" /><line x1="460" y1="119" x2="451" y2="119" class="extension" /><line x1="460" y1="134" x2="451" y2="134" class="extension" /><line x1="449" y1="119" x2="449" y2="134" class="dim" /><line x1="448" y1="120" x2="450" y2="118" class="dim" /><line x1="448" y1="135" x2="450" y2="133" class="dim" /><g transform="translate(447.3 126.5) rotate(-90)"><text x="0" y="0" font-size="2.6" class="dim halo" text-anchor="middle">150</text></g><line x1="780" y1="119" x2="797" y2="119" class="extension" /><line x1="780" y1="139" x2="797" y2="139" class="extension" /><line x1="795" y1="119" x2="795" y2="139" class="dim" /><line x1="794" y1="120" x2="796" y2="118" class="dim" /><line x1="794" y1="140" x2="796" y2="138" class="dim" /><g transform="translate(793.3 129) rotate(-90)"><text x="0" y="0" font-size="2.6" class="dim halo" text-anchor="middle">200</text></g><text x="463" y="112" font-size="2.9" class="bold" text-anchor="start">Horné líce dosky: kóta voči R0 zatiaľ neurčená</text><text x="460" y="154" font-size="3" class="" text-anchor="start">150–200 mm je rozsah požiadavky, nie zvolená hrúbka. Obidva dolné obrysy sú alternatívne hranice rozsahu; nejde o dve vrstvy betónu.</text><text x="460" y="183" font-size="3" class="" text-anchor="start">Nad nosnou doskou: vodovod a kanalizácia so spádmi → tepelné a systémové vrstvy → vykurovací poter → povrch. Bez dodatočných vrtov do dosky. Hrúbky, križovania a vývody cez obvod musí uzavrieť nový návrh.</text><text x="12" y="262" font-size="3.7" class="bold" text-anchor="start">VNÚTORNÉ REBRÁ A ZÁKLADOVÁ PÔDA</text><rect x="12" y="272" width="817" height="10" class="thin" fill="#efefef"/><text x="14" y="278" font-size="2.7" class="bold" text-anchor="start">Prvok / rozhodnutie</text><text x="201.91" y="278" font-size="2.7" class="bold" text-anchor="start">Záväzné zadanie / nadväznosť</text><text x="553.22" y="278" font-size="2.7" class="bold" text-anchor="start">Čo ešte určuje návrh</text><rect x="12" y="282" width="817" height="18" class="rule" fill="white"/><text x="14" y="286.5" font-size="2.6" class="" text-anchor="start">R1–R7 · vnútorné trasy</text><text x="201.91" y="286.5" font-size="2.6" class="" text-anchor="start">Monolitické, v horných 600 mm podľa stavebníka. Musia mať konkrétnu cestu prenosu zaťaženia do únosného podkladu alebo podpor.</text><text x="553.22" y="286.5" font-size="2.6" class="" text-anchor="start">Polohy, šírky, uloženie, výstuž a spoje podľa reakcií stien, stropu a krovu.</text><rect x="12" y="300" width="817" height="18" class="rule" fill="white"/><text x="14" y="304.5" font-size="2.6" class="" text-anchor="start">Zásyp pod doskou</text><text x="201.91" y="304.5" font-size="2.6" class="" text-anchor="start">Stavebník požaduje zhutnenú zeminu. Vhodnosť existujúcej zeminy, vlhkosť, hutnenie po vrstvách a výsledná únosnosť nie sú overené.</text><text x="553.22" y="304.5" font-size="2.6" class="" text-anchor="start">Geotechnické posúdenie a merateľné podmienky prevzatia podkladu.</text><rect x="12" y="318" width="817" height="18" class="rule" fill="white"/><text x="14" y="322.5" font-size="2.6" class="" text-anchor="start">Betón C16/20</text><text x="201.91" y="322.5" font-size="2.6" class="" text-anchor="start">Požadovaný pre pokračovanie; fotografie ani názov triedy nepotvrdzujú dodanú zmes alebo vhodnosť pre všetky prvky.</text><text x="553.22" y="322.5" font-size="2.6" class="" text-anchor="start">Doklad o dodávke, expozičné triedy, krytie a statická únosnosť. Sokel posúdiť samostatne.</text><rect x="12" y="336" width="817" height="18" class="rule" fill="white"/><text x="14" y="340.5" font-size="2.6" class="" text-anchor="start">Škáry a monolit</text><text x="201.91" y="340.5" font-size="2.6" class="" text-anchor="start">Spodný pás už bol betonovaný. Nová horná časť bude mať pracovnú škáru; monolitický systém neznamená betonáž bez škáry.</text><text x="553.22" y="340.5" font-size="2.6" class="" text-anchor="start">Príprava a posúdenie styku, prenos šmyku, zakotvenie a postup betonáže.</text><rect x="12" y="354" width="817" height="18" class="rule" fill="white"/><text x="14" y="358.5" font-size="2.6" class="" text-anchor="start">Ťažké priečky SA30</text><text x="201.91" y="358.5" font-size="2.6" class="" text-anchor="start">AK-01/02 zaťažujú dosku aj ako nenosné priečky. Ich vlastná hmotnosť je vyčíslená na ZA-01; kandidátna trasa R7 na ZA-03.</text><text x="553.22" y="358.5" font-size="2.6" class="" text-anchor="start">Posúdiť existujúcu dosku a podopretie oboch plášťov. SA30 ani H200 neslúžia ako potvrdené podpery strechy alebo stropu.</text><line x1="12" y1="272" x2="12" y2="372" class="rule" /><line x1="199.91" y1="272" x2="199.91" y2="372" class="rule" /><line x1="551.22" y1="272" x2="551.22" y2="372" class="rule" /><line x1="829" y1="272" x2="829" y2="372" class="rule" /><text x="12" y="394" font-size="3.5" class="bold" text-anchor="start">VÝŠKA PODLAHY SA NAVRHNE Z NADVÄZUJÚCICH ÚROVNÍ</text><text x="12" y="407" font-size="3.4" class="bold" text-anchor="start">Všetko v mm: ΔFFL = zE + 600 + j + p</text><text x="12" y="417" font-size="2.9" class="" text-anchor="start">zE = zameraný vrch existujúceho spodného pásu nad R0; j = vrch dosky mínus vrch nového pásu; p = úplná podlahová skladba nad doskou.</text><rect x="12" y="429" width="817" height="10" class="thin" fill="#efefef"/><text x="14" y="435" font-size="2.7" class="bold" text-anchor="start">Možný styk dosky s pásom</text><text x="365.31" y="435" font-size="2.7" class="bold" text-anchor="start">Výšková väzba; styk a únosnosť musí určiť návrh</text><rect x="12" y="439" width="817" height="10" class="rule" fill="white"/><text x="14" y="443.5" font-size="2.6" class="" text-anchor="start">Horné líca dosky a nového pásu zarovnané</text><text x="365.31" y="443.5" font-size="2.6" class="" text-anchor="start">j = 0; hrúbka dosky sa k vrchu pásu znova nepripočíta.</text><rect x="12" y="449" width="817" height="10" class="rule" fill="white"/><text x="14" y="453.5" font-size="2.6" class="" text-anchor="start">Celá doska uložená nad novým pásom</text><text x="365.31" y="453.5" font-size="2.6" class="" text-anchor="start">j = hrúbka dosky; 150–200 mm je zatiaľ len požadovaný rozsah.</text><line x1="12" y1="429" x2="12" y2="459" class="rule" /><line x1="363.31" y1="429" x2="363.31" y2="459" class="rule" /><line x1="829" y1="429" x2="829" y2="459" class="rule" /><text x="12" y="492" font-size="2.7" class="" text-anchor="start">KONTROLA TLAČE 100 % · 200 mm = 20 mm na papieri</text><line x1="12" y1="498" x2="32" y2="498" class="heavy" /><line x1="12" y1="495" x2="12" y2="501" class="thin" /><line x1="32" y1="495" x2="32" y2="501" class="thin" /><text x="39" y="499" font-size="2.7" class="" text-anchor="start">1 : 10 · vypnúť „prispôsobiť strane“</text><line x1="12" y1="513" x2="829" y2="513" class="heavy" /><text x="12" y="523" font-size="6" class="bold" text-anchor="start">NOVOSTAVBA RD BŘEZÍ U MIKULOVA</text><text x="12" y="531" font-size="3.6" class="bold" text-anchor="start">PARCELA 6012/26 · HLAVNÝ NÁVRH C / B / B</text><text x="12" y="541" font-size="5" class="bold" text-anchor="start">Monolitické založenie · rozmery a väzby</text><text x="12" y="550" font-size="2.6" class="" text-anchor="start">R0 = 184,200 m · M0 = PODLAHA MODELU · ΔFFL = M0 − R0 ZATIAĽ NEURČENÉ</text><text x="12" y="559" font-size="2.8" class="" text-anchor="start">Rozmery 350/600/150–200 mm pochádzajú zo zadania stavebníka. Zameranie a statické overenie chýbajú. Nejde o výkres výstuže ani pokyn na pokračovanie betonáže.</text><line x1="500" y1="513" x2="500" y2="581" class="thin" /><text x="509" y="522" font-size="2.5" class="muted" text-anchor="start">STAV</text><text x="509" y="530" font-size="4.8" class="bold" text-anchor="start">NEVYDANÉ NA REALIZÁCIU</text><text x="509" y="538" font-size="2.8" class="" text-anchor="start">Chýbajúci návrh sa nesmie nahradiť mierkou výkresu.</text><text x="509" y="549" font-size="2.8" class="" text-anchor="start">VYPRACOVAL: digitálne dvojča · bez autorizačnej pečiatky</text><text x="509" y="557" font-size="2.8" class="" text-anchor="start">DÁTUM 2026-09-14   FORMÁT A1 841 × 594 mm   MIERKA 1 : 10</text><text x="509" y="565" font-size="2.4" class="" text-anchor="start">ZDROJ 6cd4bc82841b · úplné odtlačky v model-snapshot.json</text><text x="829" y="578" font-size="6" class="bold" text-anchor="end">D1.1.ZA-02</text></svg>