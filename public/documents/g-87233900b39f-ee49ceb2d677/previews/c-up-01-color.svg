  </defs><rect width="841" height="594" fill="white"/><rect x="5" y="5" width="831" height="584" class="thin" fill="none"/><text x="12" y="19" font-size="3.6" class="bold" text-anchor="start">C.UP-01</text><text x="12" y="30" font-size="6" class="bold" text-anchor="start">Kontrola územného plánu</text><text x="829" y="19" font-size="3" class="" text-anchor="end">C / B / B · 14. 09. 2026</text><line x1="12" y1="36" x2="829" y2="36" class="thin" /><text x="12" y="50" font-size="4" class="bold" text-anchor="start">PARCELA 6012/26 · PRIRADENIE DO Z.7 / SV / ZÓNA C</text><text x="12" y="63" font-size="3.2" class="" text-anchor="start">Priradenie je interpretácia oficiálnej mapy podľa zhodného katastrálneho obrysu. ÚP po zmene č. 3 je účinný od 22.05.2026. Výšková kontrola používa aktuálne pravidlá, nie staré projektové kóty.</text><rect x="12" y="90" width="817" height="10" class="thin" fill="#efefef"/><text x="14" y="96" font-size="2.7" class="bold" text-anchor="start">Požiadavka</text><text x="259.1" y="96" font-size="2.7" class="bold" text-anchor="start">Údaj / zdroj</text><text x="602.24" y="96" font-size="2.7" class="bold" text-anchor="start">Stav C/B/B</text><rect x="12" y="100" width="817" height="20" class="rule" fill="white"/><text x="14" y="104.5" font-size="2.6" class="" text-anchor="start">Rímsa najviac 4,5 m</text><text x="259.1" y="104.5" font-size="2.6" class="" text-anchor="start">ÚP I.F.3, tlačená str.34: od najvyššej vozovky po spodnú uličnú rímsu. Pri oznámenom R0 = 184,200 m vychádza limit 188,700 m.</text><text x="602.24" y="104.5" font-size="2.6" class="" text-anchor="start">M+3,125 je hrana strešnej roviny, nie overený spodok rímsy. ΔFFL a finálny detail chýbajú.</text><rect x="12" y="120" width="817" height="20" class="rule" fill="white"/><text x="14" y="124.5" font-size="2.6" class="" text-anchor="start">Sedlová strecha 25–40°</text><text x="259.1" y="124.5" font-size="2.6" class="" text-anchor="start">ÚP I.F.3, str.35, zóna C. Modelový obal je záväzný; sklon sa počíta z vrcholov.</text><text x="602.24" y="124.5" font-size="2.6" class="" text-anchor="start">30,706180° / 34,826887°: v rozsahu.</text><rect x="12" y="140" width="817" height="20" class="rule" fill="white"/><text x="14" y="144.5" font-size="2.6" class="" text-anchor="start">Uličná čiara 3 m</text><text x="259.1" y="144.5" font-size="2.6" class="" text-anchor="start">Štúdia Z7/Z22, PDF str.2, samostatné domy. Doplnok 2026 o 5 m sa týka radových domov.</text><text x="602.24" y="144.5" font-size="2.6" class="" text-anchor="start">Uličný odstup 3 000 mm; hlavný trakt a hrebeň rovnobežne s ulicou.</text><rect x="12" y="160" width="817" height="20" class="rule" fill="white"/><text x="14" y="164.5" font-size="2.6" class="" text-anchor="start">Odstupy</text><text x="259.1" y="164.5" font-size="2.6" class="" text-anchor="start">Štúdia Z7/Z22: k hranici min.2 m, pri obytných miestnostiach medzi domami min.7 m.</text><text x="602.24" y="164.5" font-size="2.6" class="" text-anchor="start">Pravá hranica 3 000 mm. Skutočný odstup susedného domu treba preveriť.</text><rect x="12" y="180" width="817" height="20" class="rule" fill="white"/><text x="14" y="184.5" font-size="2.6" class="" text-anchor="start">Podlaha, terén a vstup</text><text x="259.1" y="184.5" font-size="2.6" class="" text-anchor="start">Štúdia: podlaha max.0,5 m nad upraveným terénom s väzbou na obrubník; pred domom max.3 stupne. Rímsa max.4,5 m nad podlahou.</text><text x="602.24" y="184.5" font-size="2.6" class="" text-anchor="start">Stavebník chce aspoň jeden stupeň; návrhový cieľ 1 × 150 mm pred podestou. Nivelácia pásu, terénu a prahový detail chýbajú.</text><rect x="12" y="200" width="817" height="20" class="rule" fill="white"/><text x="14" y="204.5" font-size="2.6" class="" text-anchor="start">Zastavanosť, zeleň, parkovanie</text><text x="259.1" y="204.5" font-size="2.6" class="" text-anchor="start">ÚP KZP0,7 vrátane spevnených plôch. Štúdia: budovy max.50 %, zeleň min.30 %, dve parkovacie miesta.</text><text x="602.24" y="204.5" font-size="2.6" class="" text-anchor="start">Vyžaduje výkaz zjednotených plôch a overenie státí podľa konečnej situácie.</text><line x1="12" y1="90" x2="12" y2="220" class="rule" /><line x1="257.1" y1="90" x2="257.1" y2="220" class="rule" /><line x1="600.24" y1="90" x2="600.24" y2="220" class="rule" /><line x1="829" y1="90" x2="829" y2="220" class="rule" /><text x="12" y="349" font-size="3.6" class="bold" text-anchor="start">OFICIÁLNE PODKLADY · OVERENÉ 14.09.2026</text><a href="https://www.mikulov.cz/data/content_files/831/brezi-up-oop-uz.pdf"><text x="12" y="362" font-size="3" class="bold" text-anchor="start">ÚP po zmene č.3 · I.F.3 str.34–35</text><text x="12" y="368" font-size="2.7" class="" text-anchor="start">https://www.mikulov.cz/data/content_files/831/brezi-up-oop-uz.pdf</text></a><a href="https://www.mikulov.cz/data/content_files/832/1b-hlv-1.pdf"><text x="12" y="379" font-size="3" class="bold" text-anchor="start">Hlavný výkres I.b</text><text x="12" y="385" font-size="2.7" class="" text-anchor="start">https://www.mikulov.cz/data/content_files/832/1b-hlv-1.pdf</text></a><a href="https://www.mikulov.cz/data/content_files/832/1f-urbanisticka-kompozice.pdf"><text x="12" y="396" font-size="3" class="bold" text-anchor="start">Urbanistická kompozícia I.f · výška4,5m</text><text x="12" y="402" font-size="2.7" class="" text-anchor="start">https://www.mikulov.cz/data/content_files/832/1f-urbanisticka-kompozice.pdf</text></a><a href="https://www.mikulov.cz/data/content_files/731/textova-cast-souhlas-obce-stavebni-cara-5m.pdf"><text x="12" y="413" font-size="3" class="bold" text-anchor="start">Štúdia Z7/Z22 + doplnok2026 · PDF2–4</text><text x="12" y="419" font-size="2.7" class="" text-anchor="start">https://www.mikulov.cz/data/content_files/731/textova-cast-souhlas-obce-stavebni-cara-5m.pdf</text></a><rect x="468" y="349" width="356" height="10" class="thin" fill="#efefef"/><text x="470" y="355" font-size="2.7" class="bold" text-anchor="start">Vzťah k R0 = 184,200 m</text><text x="648" y="355" font-size="2.7" class="bold" text-anchor="start">Výška [m]</text><rect x="468" y="359" width="356" height="12" class="rule" fill="white"/><text x="470" y="363.5" font-size="2.6" class="" text-anchor="start">Hotová podlaha M0</text><text x="648" y="363.5" font-size="2.6" class="" text-anchor="start">184,200 + ΔFFL</text><rect x="468" y="371" width="356" height="12" class="rule" fill="white"/><text x="470" y="375.5" font-size="2.6" class="" text-anchor="start">Hrana strešných rovín</text><text x="648" y="375.5" font-size="2.6" class="" text-anchor="start">187,325 + ΔFFL</text><rect x="468" y="383" width="356" height="12" class="rule" fill="white"/><text x="470" y="387.5" font-size="2.6" class="" text-anchor="start">Hrebeň strešných rovín</text><text x="648" y="387.5" font-size="2.6" class="" text-anchor="start">189,760 + ΔFFL</text><rect x="468" y="395" width="356" height="12" class="rule" fill="white"/><text x="470" y="399.5" font-size="2.6" class="" text-anchor="start">Limit spodnej uličnej rímsy</text><text x="648" y="399.5" font-size="2.6" class="" text-anchor="start">188,700 (podmienené R0)</text><line x1="468" y1="349" x2="468" y2="407" class="rule" /><line x1="646" y1="349" x2="646" y2="407" class="rule" /><line x1="824" y1="349" x2="824" y2="407" class="rule" /><text x="468" y="417" font-size="2.8" class="" text-anchor="start">ΔFFL = rozdiel podlahy k ulici v metroch, zatiaľ neurčený. Bpv a XY bodu treba potvrdiť. Vizualizačný biely portál siaha nad strešnú rovinu; finálny obal a spodok rímsy určí detail.</text><text x="12" y="492" font-size="2.7" class="" text-anchor="start">KONTROLA TLAČE 100 % · 1 000 mm = 20 mm na papieri</text><line x1="12" y1="498" x2="32" y2="498" class="heavy" /><line x1="12" y1="495" x2="12" y2="501" class="thin" /><line x1="32" y1="495" x2="32" y2="501" class="thin" /><text x="39" y="499" font-size="2.7" class="" text-anchor="start">1 : 50 · vypnúť „prispôsobiť strane“</text><line x1="12" y1="513" x2="829" y2="513" class="heavy" /><text x="12" y="523" font-size="6" class="bold" text-anchor="start">NOVOSTAVBA RD BŘEZÍ U MIKULOVA</text><text x="12" y="531" font-size="3.6" class="bold" text-anchor="start">PARCELA 6012/26 · HLAVNÝ NÁVRH C / B / B</text><text x="12" y="541" font-size="5" class="bold" text-anchor="start">Kontrola územného plánu</text><text x="12" y="550" font-size="2.6" class="" text-anchor="start">R0 = 184,200 m · M0 = PODLAHA MODELU · ΔFFL = M0 − R0 ZATIAĽ NEURČENÉ</text><text x="12" y="559" font-size="2.8" class="" text-anchor="start">Nejde o potvrdenie stavebného úradu. Všetky nesplnené alebo neoverené položky zostávajú otvorené do získania konkrétnych podkladov.</text><line x1="500" y1="513" x2="500" y2="581" class="thin" /><text x="509" y="522" font-size="2.5" class="muted" text-anchor="start">STAV</text><text x="509" y="530" font-size="4.8" class="bold" text-anchor="start">NEVYDANÉ NA REALIZÁCIU</text><text x="509" y="538" font-size="2.8" class="" text-anchor="start">Chýbajúci návrh sa nesmie nahradiť mierkou výkresu.</text><text x="509" y="549" font-size="2.8" class="" text-anchor="start">VYPRACOVAL: digitálne dvojča · bez autorizačnej pečiatky</text><text x="509" y="557" font-size="2.8" class="" text-anchor="start">DÁTUM 2026-09-14   FORMÁT A1 841 × 594 mm   MIERKA tabuľka</text><text x="509" y="565" font-size="2.4" class="" text-anchor="start">ZDROJ 6cd4bc82841b · úplné odtlačky v model-snapshot.json</text><text x="829" y="578" font-size="6" class="bold" text-anchor="end">C.UP-01</text></svg>