"start">Murivo / keramické prvky</text><rect x="592" y="351" width="10" height="5" class="thin" fill="url(#insulation)"/><text x="606" y="355" font-size="2.7" class="" text-anchor="start">ETICS / minerálna vlna</text><rect x="592" y="359" width="10" height="5" class="thin" fill="url(#concrete)"/><text x="606" y="363" font-size="2.7" class="" text-anchor="start">Betón – len ak je určený návrhom</text><rect x="592" y="367" width="10" height="5" class="thin" fill="url(#timber)"/><text x="606" y="371" font-size="2.7" class="" text-anchor="start">Drevený obklad</text><text x="592" y="383" font-size="2.7" class="" text-anchor="start">Čiarkovane: prerušené / neurčené konštrukcie.</text><text x="592" y="390" font-size="2.7" class="" text-anchor="start">M = výška k podlahe modelu. Dĺžky v mm.</text><text x="592" y="396" font-size="2.7" class="" text-anchor="start">K ulici R0: z = M + ΔFFL. ΔFFL neurčené.</text><text x="592" y="407" font-size="3" class="" text-anchor="start">Obvodový plášť SO30 + TI20: nosné murivo 300 mm a ETICS 200 mm. Voľné piliere SO50: 500 mm plné murivo. Skladby a detaily DT/SK.</text><text x="52" y="243" font-size="2.8" class="halo" text-anchor="start">M0 · podlaha modelu; R0 = 184,200 m ulica; ΔFFL zatiaľ neurčené</text><text x="12" y="492" font-size="2.7" class="" text-anchor="start">KONTROLA TLAČE 100 % · 1 000 mm = 20 mm na papieri</text><line x1="12" y1="498" x2="32" y2="498" class="heavy" /><line x1="12" y1="495" x2="12" y2="501" class="thin" /><line x1="32" y1="495" x2="32" y2="501" class="thin" /><text x="39" y="499" font-size="2.7" class="" text-anchor="start">1 : 50 · vypnúť „prispôsobiť strane“</text><line x1="12" y1="513" x2="829" y2="513" class="heavy" /><text x="12" y="523" font-size="6" class="bold" text-anchor="start">NOVOSTAVBA RD BŘEZÍ U MIKULOVA</text><text x="12" y="531" font-size="3.6" class="bold" text-anchor="start">PARCELA 6012/26 · HLAVNÝ NÁVRH C / B / B</text><text x="12" y="541" font-size="5" class="bold" text-anchor="start">Západný štít garáže</text><text x="12" y="550" font-size="2.6" class="" text-anchor="start">R0 = 184,200 m · M0 = PODLAHA MODELU · ΔFFL = M0 − R0 ZATIAĽ NEURČENÉ</text><text x="12" y="559" font-size="2.8" class="" text-anchor="start">Presná modelová projekcia. R05/R06: chýba skutočný terén, sokel, finálne povrchy a realizačné detaily. Rozmery otvorov sú modelové stavebné otvory; výrobný rozmer určí dodávateľ.</text><line x1="500" y1="513" x2="500" y2="581" class="thin" /><text x="509" y="522" font-size="2.5" class="muted" text-anchor="start">STAV</text><text x="509" y="530" font-size="4.8" class="bold" text-anchor="start">NEVYDANÉ NA REALIZÁCIU</text><text x="509" y="538" font-size="2.8" class="" text-anchor="start">Chýbajúci návrh sa nesmie nahradiť mierkou výkresu.</text><text x="509" y="549" font-size="2.8" class="" text-anchor="start">VYPRACOVAL: digitálne dvojča · bez autorizačnej pečiatky</text><text x="509" y="557" font-size="2.8" class="" text-anchor="start">DÁTUM 2026-09-14   FORMÁT A1 841 × 594 mm   MIERKA 1 : 50</text><text x="509" y="565" font-size="2.4" class="" text-anchor="start">ZDROJ 6cd4bc82841b · úplné odtlačky v model-snapshot.json</text><text x="829" y="578" font-size="6" class="bold" text-anchor="end">D1.1.PO-04</text></svg>