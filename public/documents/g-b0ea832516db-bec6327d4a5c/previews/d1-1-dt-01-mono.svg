or="start">300</text><line x1="150" y1="72" x2="150" y2="91" class="rule" /><line x1="676.5" y1="72" x2="676.5" y2="91" class="rule" /><line x1="825" y1="72" x2="825" y2="91" class="rule" /><text x="150" y="100" font-size="3.2" class="" text-anchor="start">AK-01 / AK-02: dôvod odhlučnenia zostáva. Jedna 300 mm obvodová tehla, bez vaty a predsteny; bežné povrchy navyše. Výrobok, hmotnosť a nepriezvučnosť treba doplniť.</text><text x="12" y="198" font-size="4.2" class="bold" text-anchor="start">H200 · LeierPLAN 10 + akustická predstena Silentboard</text><rect x="25" y="206" width="2.5" height="55" class="medium" fill="#eee"/><rect x="27.5" y="206" width="9" height="55" class="medium" fill="url(#insulation)"/><line x1="27.5" y1="262" x2="27.5" y2="275" class="extension" /><line x1="36.5" y1="262" x2="36.5" y2="275" class="extension" /><line x1="27.5" y1="273" x2="36.5" y2="273" class="dim" /><line x1="26.5" y1="274" x2="28.5" y2="272" class="dim" /><line x1="35.5" y1="274" x2="37.5" y2="272" class="dim" /><text x="32" y="271.4" font-size="2.6" class="dim halo" text-anchor="middle">45</text><rect x="36.5" y="206" width="3" height="55" class="medium" fill="#eee"/><line x1="36.5" y1="262" x2="36.5" y2="275" class="extension" /><line x1="39.5" y1="262" x2="39.5" y2="275" class="extension" /><line x1="36.5" y1="273" x2="39.5" y2="273" class="dim" /><line x1="35.5" y1="274" x2="37.5" y2="272" class="dim" /><line x1="38.5" y1="274" x2="40.5" y2="272" class="dim" /><text x="38" y="271.4" font-size="2.6" class="dim halo" text-anchor="middle">15</text><rect x="39.5" y="206" width="20" height="55" class="medium" fill="url(#murivo)"/><line x1="39.5" y1="262" x2="39.5" y2="275" class="extension" /><line x1="59.5" y1="262" x2="59.5" y2="275" class="extension" /><line x1="39.5" y1="273" x2="59.5" y2="273" class="dim" /><line x1="38.5" y1="274" x2="40.5" y2="272" class="dim" /><line x1="58.5" y1="274" x2="60.5" y2="272" class="dim" /><text x="49.5" y="271.4" font-size="2.6" class="dim