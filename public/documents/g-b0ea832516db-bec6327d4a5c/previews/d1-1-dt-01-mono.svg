"start">KÚPEĽŇA 1.05 · D9</text><text x="95.6" y="441.9" font-size="2.7" class="bold" text-anchor="start">PRACOVŇA 1.04 · D8</text><text x="12" y="382.9" font-size="2.5" class="" text-anchor="start">CHODBA</text><line x1="153.6" y1="358" x2="165.6" y2="358" class="extension" /><line x1="153.6" y1="387.9" x2="165.6" y2="387.9" class="extension" /><line x1="163.6" y1="358" x2="163.6" y2="387.9" class="dim" /><line x1="162.6" y1="359" x2="164.6" y2="357" class="dim" /><line x1="162.6" y1="388.9" x2="164.6" y2="386.9" class="dim" /><g transform="translate(161.9 372.95) rotate(-90)"><text x="0" y="0" font-size="2.6" class="dim halo" text-anchor="middle">149,5</text></g><line x1="153.6" y1="387.9" x2="165.6" y2="387.9" class="extension" /><line x1="153.6" y1="425.4" x2="165.6" y2="425.4" class="extension" /><line x1="163.6" y1="387.9" x2="163.6" y2="425.4" class="dim" /><line x1="162.6" y1="388.9" x2="164.6" y2="386.9" class="dim" /><line x1="162.6" y1="426.4" x2="164.6" y2="424.4" class="dim" /><g transform="translate(161.9 406.65) rotate(-90)"><text x="0" y="0" font-size="2.6" class="dim halo" text-anchor="middle">187,5</text></g><line x1="153.6" y1="425.4" x2="165.6" y2="425.4" class="extension" /><line x1="153.6" y1="433.9" x2="165.6" y2="433.9" class="extension" /><line x1="163.6" y1="425.4" x2="163.6" y2="433.9" class="dim" /><line x1="162.6" y1="426.4" x2="164.6" y2="424.4" class="dim" /><line x1="162.6" y1="434.9" x2="164.6" y2="432.9" class="dim" /><g transform="translate(161.9 429.65) rotate(-90)"><text x="0" y="0" font-size="2.6" class="dim halo" text-anchor="middle">42,5</text></g><line x1="73.6" y1="422.9" x2="73.6" y2="414.9" class="extension" /><line x1="74.6" y1="422.9" x2="74.6" y2="414.9" class="extension" /><line x1="73.6" y1="412.9" x2="74.6" y2="412.9" class="dim" /><line x1="72.6" y1="413.9" x2="74.6" y2="411.9" class="dim" /><line x1="73.6" y1="413.9" x2="75.6" y2="411.9" class="dim" /><text x="74.1" y="411.29999999999995" font-size="2.6" class="dim halo" text-anchor="middle">J1 · 5</text><line x1="85.4" y1="425.4" x2="102.4" y2="425.4" class="extension" /><line x1="85.4" y1="426.4" x2="102.4" y2="426.4" class="extension" /><line x1="100.4" y1="425.4" x2="100.4" y2="426.4" class="dim" /><line x1="99.4" y1="426.4" x2="101.4" y2="424.4" class="dim" /><line x1="99.4" y1="427.4" x2="101.4" y2="425.4" class="dim" /><g transform="translate(98.7 425.9) rotate(-90)"><text x="0" y="0" font-size="2.6" class="dim halo" text-anchor="middle">J2 · 5</text></g><text x="75.6" y="429.9" font-size="2.5" class="halo" text-anchor="start">37,5 + 5</text><rect x="205" y="346" width="620" height="10" class="thin" fill="#efefef"/><text x="207" y="352" font-size="2.7" class="bold" text-anchor="start">Spoj / súradnice [mm]</text><text x="436.4" y="352" font-size="2.7" class="bold" text-anchor="start">Predpis existujúceho detailu</text><rect x="205" y="356" width="620" height="13" class="rule" fill="white"/><text x="207" y="360.5" font-size="2.6" class="" text-anchor="start">J1 · X 22 783–22 788 / Y 6 364,5–6 377</text><text x="436.4" y="360.5" font-size="2.6" class="" text-anchor="start">Čelo jedinej dosky: 5 mm, Trenn-Fix + Uniflott podľa princípu W623-B2.</text><rect x="205" y="369" width="620" height="13" class="rule" fill="white"/><text x="207" y="373.5" font-size="2.6" class="" text-anchor="start">J2 · X 22 783–22 842 / Y 6 359,5–6 364,5</text><text x="436.4" y="373.5" font-size="2.6" class="" text-anchor="start">5 mm mäkké oddelenie pri líci vonkajšej dosky. Pružný akustický tmel na vhodnej podkladovej vrstve; bez sadry alebo malty.</text><line x1="205" y1="346" x2="205" y2="382" class="rule" /><line x1="434.4" y1="346" x2="434.4" y2="382" class="rule" /><line x1="825" y1="346" x2="825" y2="382" class="rule" /><text x="205" y="399" font-size="2.7" class="" text-anchor="start">Súradnice predstavujú návrhovú rezervu v nominálnom pôdoryse; realizačná škára sa meria od hotového kontaktného povrchu. Veľký pôdorys a 3D zachovávajú obálku konštrukcie. Ich plná výplň v mierke domu nepredpisuje zaliatie škár J1/J2. Záväzný princíp ich vyhotovenia je v tomto zväčšenom detaile.</text><text x="205" y="429" font-size="2.7" class="bold" text-anchor="start">Obvodový UD, podtesnenie a mechanické kotvy nie sú v tejto schéme určené. R07: dopracovať kotvy, závesy, stabilitu muriva, spoje pri podlahe a strope a hydroizoláciu sprchy. J2 je projektový detail, nie skúšaný katalógový spoj.</text><text x="12" y="492" font-size="2.7" class="" text-anchor="start">KONTROLA TLAČE 100 % · 100 mm = 20 mm na papieri</text><line x1="12" y1="498" x2="32" y2="498" class="heavy" /><line x1="12" y1="495" x2="12" y2="501" class="thin" /><line x1="32" y1="495" x2="32" y2="501" class="thin" /><text x="39" y="499" font-size="2.7" class="" text-anchor="start">1 : 5 · vypnúť „prispôsobiť strane“</text><line x1="12" y1="513" x2="829" y2="513" class="heavy" /><text x="12" y="523" font-size="6" class="bold" text-anchor="start">NOVOSTAVBA RD BŘEZÍ U MIKULOVA</text><text x="12" y="531" font-size="3.6" class="bold" text-anchor="start">PARCELA 6012/26 · HLAVNÝ NÁVRH C / B / B</text><text x="12" y="541" font-size="5" class="bold" text-anchor="start">Akustické steny H200 / SM30</text><text x="12" y="550" font-size="2.6" class="" text-anchor="start">R0 = 184,200 m · M0 = PODLAHA MODELU · ΔFFL = M0 − R0 ZATIAĽ NEURČENÉ</text><text x="12" y="559" font-size="2.8" class="" text-anchor="start">Vrstvy z lib/acoustic-walls.ts. J1/J2 z lib/h200-junction.json. Detail vrstiev 1:5; realizačné kotvenie a nosné napojenia vyžadujú nový návrh.</text><line x1="500" y1="513" x2="500" y2="581" class="thin" /><text x="509" y="522" font-size="2.5" class="muted" text-anchor="start">STAV</text><text x="509" y="530" font-size="4.8" class="bold" text-anchor="start">NEVYDANÉ NA REALIZÁCIU</text><text x="509" y="538" font-size="2.8" class="" text-anchor="start">Chýbajúci návrh sa nesmie nahradiť mierkou výkresu.</text><text x="509" y="549" font-size="2.8" class="" text-anchor="start">VYPRACOVAL: digitálne dvojča · bez autorizačnej pečiatky</text><text x="509" y="557" font-size="2.8" class="" text-anchor="start">DÁTUM 2026-09-16   FORMÁT A1 841 × 594 mm   MIERKA 1 : 5</text><text x="509" y="565" font-size="2.4" class="" text-anchor="start">ZDROJ 4676f56cd888 · úplné odtlačky v model-snapshot.json</text><text x="829" y="578" font-size="6" class="bold" text-anchor="end">D1.1.DT-01</text></svg>