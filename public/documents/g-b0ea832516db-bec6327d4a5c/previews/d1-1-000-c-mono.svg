  </defs><rect width="841" height="594" fill="white"/><rect x="5" y="5" width="831" height="584" class="thin" fill="none"/><text x="12" y="19" font-size="3.6" class="bold" text-anchor="start">D1.1.000-C</text><text x="12" y="30" font-size="6" class="bold" text-anchor="start">Register výkresov a otvorených bodov</text><text x="829" y="19" font-size="3" class="" text-anchor="end">C / B / B · 16. 09. 2026 </text><line x1="12" y1="36" x2="829" y2="36" class="thin" /><text x="12" y="50" font-size="4.4" class="bold" text-anchor="start">VÝKRESOVÁ SADA · REGISTER VYDANIA</text><text x="12" y="62" font-size="3.5" class="bold" text-anchor="start">Táto sada zachováva hotový pôdorys C/B/B a oddeľuje presnú modelovú geometriu od konštrukcií, ktoré treba nanovo navrhnúť. Požadovaná realizačná úplnosť zatiaľ nie je dosiahnutá.</text><rect x="12" y="84" width="380" height="10" class="thin" fill="#efefef"/><text x="14" y="90" font-size="2.7" class="bold" text-anchor="start">List</text><text x="143.20000000000002" y="90" font-size="2.7" class="bold" text-anchor="start">Obsah</text><rect x="12" y="94" width="380" height="10" class="rule" fill="white"/><text x="14" y="98.5" font-size="2.6" class="" text-anchor="start">D1.1.002-C-RE</text><text x="143.20000000000002" y="98.5" font-size="2.6" class="" text-anchor="start">Existujúci pôdorys · stopy rezov</text><rect x="12" y="104" width="380" height="10" class="rule" fill="white"/><text x="14" y="108.5" font-size="2.6" class="" text-anchor="start">D1.1.PO-01</text><text x="143.20000000000002" y="108.5" font-size="2.6" class="" text-anchor="start">Južná (uličná) fasáda</text><rect x="12" y="114" width="380" height="10" class="rule" fill="white"/><text x="14" y="118.5" font-size="2.6" class="" text-anchor="start">D1.1.PO-02</text><text x="143.20000000000002" y="118.5" font-size="2.6" class="" text-anchor="start">Východná fasáda</text><rect x="12" y="124" width="380" height="10" class="rule" fill="white"/><text x="14" y="128.5" font-size="2.6" class="" text-anchor="start">D1.1.PO-03</text><text x="143.20000000000002" y="128.5" font-size="2.6" class="" text-anchor="start">Záhradná (severná) fasáda</text><rect x="12" y="134" width="380" height="10" class="rule" fill="white"/><text x="14" y="138.5" font-size="2.6" class="" text-anchor="start">D1.1.PO-04</text><text x="143.20000000000002" y="138.5" font-size="2.6" class="" text-anchor="start">Západný štít garáže</text><rect x="12" y="144" width="380" height="10" class="rule" fill="white"/><text x="14" y="148.5" font-size="2.6" class="" text-anchor="start">D1.1.PO-05</text><text x="143.20000000000002" y="148.5" font-size="2.6" class="" text-anchor="start">Západná stena krídla</text><rect x="12" y="154" width="380" height="10" class="rule" fill="white"/><text x="14" y="158.5" font-size="2.6" class="" text-anchor="start">D1.1.PO-06</text><text x="143.20000000000002" y="158.5" font-size="2.6" class="" text-anchor="start">Štít krídla · portál krytej terasy</text><rect x="12" y="164" width="380" height="10" class="rule" fill="white"/><text x="14" y="168.5" font-size="2.6" class="" text-anchor="start">D1.1.PO-07</text><text x="143.20000000000002" y="168.5" font-size="2.6" class="" text-anchor="start">Krytá terasa · zasklená stena</text><rect x="12" y="174" width="380" height="10" class="rule" fill="white"/><text x="14" y="178.5" font-size="2.6" class="" text-anchor="start">D1.1.PO-08</text><text x="143.20000000000002" y="178.5" font-size="2.6" class="" text-anchor="start">Lodžia · zadná stena garáže</text><rect x="12" y="184" width="380" height="10" class="rule" fill="white"/><text x="14" y="188.5" font-size="2.6" class="" text-anchor="start">D1.1.RE-01</text><text x="143.20000000000002" y="188.5" font-size="2.6" class="" text-anchor="start">A-A · Pozdĺžny rez krídlom</text><rect x="12" y="194" width="380" height="10" class="rule" fill="white"/><text x="14" y="198.5" font-size="2.6" class="" text-anchor="start">D1.1.RE-02</text><text x="143.20000000000002" y="198.5" font-size="2.6" class="" text-anchor="start">B-B · Priečny rez katedrálovým stropom</text><rect x="12" y="204" width="380" height="10" class="rule" fill="white"/><text x="14" y="208.5" font-size="2.6" class="" text-anchor="start">D1.1.RE-03</text><text x="143.20000000000002" y="208.5" font-size="2.6" class="" text-anchor="start">C-C · Priečny rez hlavným traktom</text><rect x="12" y="214" width="380" height="10" class="rule" fill="white"/><text x="14" y="218.5" font-size="2.6" class="" text-anchor="start">D1.1.ZA-01</text><text x="143.20000000000002" y="218.5" font-size="2.6" class="" text-anchor="start">Základy · nosné línie a ťažké priečky</text><rect x="12" y="224" width="380" height="10" class="rule" fill="white"/><text x="14" y="228.5" font-size="2.6" class="" text-anchor="start">D1.1.ZA-02</text><text x="143.20000000000002" y="228.5" font-size="2.6" class="" text-anchor="start">Monolitické založenie · rozmery a väzby</text><rect x="12" y="234" width="380" height="10" class="rule" fill="white"/><text x="14" y="238.5" font-size="2.6" class="" text-anchor="start">D1.1.ZA-03</text><text x="143.20000000000002" y="238.5" font-size="2.6" class="" text-anchor="start">Základy · priestorový pohľad na pásy a rebrá</text><rect x="12" y="244" width="380" height="10" class="rule" fill="white"/><text x="14" y="248.5" font-size="2.6" class="" text-anchor="start">D1.1.ST-01</text><text x="143.20000000000002" y="248.5" font-size="2.6" class="" text-anchor="start">Pôdorys strechy</text><rect x="12" y="254" width="380" height="10" class="rule" fill="white"/><text x="14" y="258.5" font-size="2.6" class="" text-anchor="start">C.SI-01</text><text x="143.20000000000002" y="258.5" font-size="2.6" class="" text-anchor="start">Situácia osadenia · ulica</text><rect x="12" y="264" width="380" height="10" class="rule" fill="white"/><text x="14" y="268.5" font-size="2.6" class="" text-anchor="start">C.SI-02</text><text x="143.20000000000002" y="268.5" font-size="2.6" class="" text-anchor="start">Situácia osadenia · záhrada</text><rect x="12" y="274" width="380" height="10" class="rule" fill="white"/><text x="14" y="278.5" font-size="2.6" class="" text-anchor="start">C.UP-01</text><text x="143.20000000000002" y="278.5" font-size="2.6" class="" text-anchor="start">Kontrola územného plánu</text><rect x="12" y="284" width="380" height="10" class="rule" fill="white"/><text x="14" y="288.5" font-size="2.6" class="" text-anchor="start">D1.1.OT-01</text><text x="143.20000000000002" y="288.5" font-size="2.6" class="" text-anchor="start">Výpis okien a vonkajších dverí</text><rect x="12" y="294" width="380" height="10" class="rule" fill="white"/><text x="14" y="298.5" font-size="2.6" class="" text-anchor="start">D1.1.OT-02</text><text x="143.20000000000002" y="298.5" font-size="2.6" class="" text-anchor="start">Výpis vnútorných dverí</text><rect x="12" y="304" width="380" height="10" class="rule" fill="white"/><text x="14" y="308.5" font-size="2.6" class="" text-anchor="start">D1.1.SK-01</text><text x="143.20000000000002" y="308.5" font-size="2.6" class="" text-anchor="start">Skladby konštrukcií · register</text><rect x="12" y="314" width="380" height="10" class="rule" fill="white"/><text x="14" y="318.5" font-size="2.6" class="" text-anchor="start">D1.1.DT-01</text><text x="143.20000000000002" y="318.5" font-size="2.6" class="" text-anchor="start">Akustické steny H200 / SM30</text><rect x="12" y="324" width="380" height="10" class="rule" fill="white"/><text x="14" y="328.5" font-size="2.6" class="" text-anchor="start">D1.1.TZ-01</text><text x="143.20000000000002" y="328.5" font-size="2.6" class="" text-anchor="start">Podlahové vykurovanie a rozsah povaly</text><line x1="12" y1="84" x2="12" y2="334" class="rule" /><line x1="141.20000000000002" y1="84" x2="141.20000000000002" y2="334" class="rule" /><line x1="392" y1="84" x2="392" y2="334" class="rule" /><text x="420" y="91" font-size="3.3" class="bold" text-anchor="start">R01 · Nový nosný systém</text><text x="420" y="97" font-size="2.8" class="" text-anchor="start">Výpočet aktuálneho C/B/B, zaťaženie a reakcie, základy, doska, preklady, vence, oceľové rámy, krov a všetky spoje. Staré D1/D2 sú podľa stavebníka iba archív.</text><text x="420" y="110.2" font-size="3.3" class="bold" text-anchor="start">R02 · Monolit a založenie</text><text x="420" y="116.2" font-size="2.8" class="" text-anchor="start">Podľa stavebníka je doska vyliata aj s lodžiou a krytou terasou. Horný pás zadaný 350 × 600 mm. Zamerať skutočný rozsah, výšky, hrúbku a výstuž; uzavrieť podopretie a nové rebrá.</text><text x="420" y="129.4" font-size="3.3" class="bold" text-anchor="start">R03 · Nová podlaha s rozvodmi</text><text x="420" y="135.4" font-size="2.8" class="" text-anchor="start">Rozvody vody a odpadu nad nosnou doskou; žiadne dodatočné vrty do dosky. Určiť horné líce dosky, kompletnú skladbu, priemery, spády, križovania a vývod cez obvod.</text><text x="420" y="148.6" font-size="3.3" class="bold" text-anchor="start">R04 · Drevený strop a skladovacia povala</text><text x="420" y="154.6" font-size="2.8" class="" text-anchor="start">Povala iba na odkladanie, mimo obývačky. Drevené stropy bez betónovej dosky/nadbetonávky. Určiť skladovacie a bodové zaťaženia, prierezy a spoje; krov s falcovaným plechom bez presahov.</text><text x="420" y="167.79999999999998" font-size="3.3" class="bold" text-anchor="start">R05 · Spoločná nula a vstup</text><text x="420" y="173.79999999999998" font-size="2.8" class="" text-anchor="start">R0 = 184,200 m pri ulici. Podlahu navrhne projekt podľa nivelácie hotového pásu a terénu; aspoň jeden vstupný stupeň. Návrh podesty pri D2 na SI-01. Potvrdiť Bpv a bod XY.</text><text x="420" y="186.99999999999997" font-size="3.3" class="bold" text-anchor="start">R06 · Sokel, ETICS, otvory</text><text x="420" y="192.99999999999997" font-size="2.8" class="" text-anchor="start">Nové detaily hydroizolácie a sokla, založenia ETICS, parapetov, prahov, nadpraží a napojenia tesniacich vrstiev. Výpis otvorov nie je výrobný rozmer rámu.</text><text x="420" y="206.19999999999996" font-size="3.3" class="bold" text-anchor="start">R07 · Akustické priečky</text><text x="420" y="212.19999999999996" font-size="2.8" class="" text-anchor="start">Vlastná hmotnosť AK-01/02/03 a jej prenos do základov, stabilita muriva a predsteny, kotvy a obvodové spoje. SM30 zaťažuje dosku aj ako nenosná priečka. Strecha a strop potrebujú samostatné nosné riešenie.</text><text x="420" y="225.39999999999995" font-size="3.3" class="bold" text-anchor="start">R08 · Dymovody a odvodnenie</text><text x="420" y="231.39999999999995" font-size="2.8" class="" text-anchor="start">Systémový návrh a odstupy dymovodu obývačky; kotolňa B končí v modeli rezervou pod stropom, vonkajšia trasa nie je určená. Návrh žľabov, zvodov a dažďovej kanalizácie.</text><text x="420" y="244.59999999999994" font-size="3.3" class="bold" text-anchor="start">R09 · Dodávateľský výpis otvorov</text><text x="420" y="250.59999999999994" font-size="2.8" class="" text-anchor="start">Profily, zasklenie, bezpečnostné/tepelné/akustické vlastnosti, montážne škáry, kovanie a prahy. Trojuholníkový svetlík doplnený O11 bez prečíslovania O1-O10/D1-D16.</text><text x="12" y="467" font-size="3.2" class="bold" text-anchor="start">PODMIENKA VYDANIA: uzavreté R01-R09 + koordinácia všetkých profesií + kontrola všetkých listov.</text><text x="12" y="492" font-size="2.7" class="" text-anchor="start">KONTROLA TLAČE 100 % · 1 000 mm = 20 mm na papieri</text><line x1="12" y1="498" x2="32" y2="498" class="heavy" /><line x1="12" y1="495" x2="12" y2="501" class="thin" /><line x1="32" y1="495" x2="32" y2="501" class="thin" /><text x="39" y="499" font-size="2.7" class="" text-anchor="start">1 : 50 · vypnúť „prispôsobiť strane“</text><line x1="12" y1="513" x2="829" y2="513" class="heavy" /><text x="12" y="523" font-size="6" class="bold" text-anchor="start">NOVOSTAVBA RD BŘEZÍ U MIKULOVA</text><text x="12" y="531" font-size="3.6" class="bold" text-anchor="start">PARCELA 6012/26 · HLAVNÝ NÁVRH C / B / B</text><text x="12" y="541" font-size="5" class="bold" text-anchor="start">Register výkresov a otvorených bodov</text><text x="12" y="550" font-size="2.6" class="" text-anchor="start">R0 = 184,200 m · M0 = PODLAHA MODELU · ΔFFL = M0 − R0 ZATIAĽ NEURČENÉ</text><text x="12" y="559" font-size="2.8" class="" text-anchor="start">Požiadavka stavebníka 14.09.2026: nový projekt od začiatku; pôvodná statika orientačná. Pôdorys a hlavný návrh C/B/B bez zmeny.</text><line x1="500" y1="513" x2="500" y2="581" class="thin" /><text x="509" y="522" font-size="2.5" class="muted" text-anchor="start">STAV</text><text x="509" y="530" font-size="4.8" class="bold" text-anchor="start">NEVYDANÉ NA REALIZÁCIU</text><text x="509" y="538" font-size="2.8" class="" text-anchor="start">Chýbajúci návrh sa nesmie nahradiť mierkou výkresu.</text><text x="509" y="549" font-size="2.8" class="" text-anchor="start">VYPRACOVAL: digitálne dvojča · bez autorizačnej pečiatky</text><text x="509" y="557" font-size="2.8" class="" text-anchor="start">DÁTUM 2026-09-16   FORMÁT A1 841 × 594 mm   MIERKA register</text><text x="509" y="565" font-size="2.4" class="" text-anchor="start">ZDROJ 4676f56cd888 · úplné odtlačky v model-snapshot.json</text><text x="829" y="578" font-size="6" class="bold" text-anchor="end">D1.1.000-C</text></svg>