><text x="153.42000000000002" y="279" font-size="2.8" class="bold" text-anchor="middle">E</text><line x1="260" y1="260" x2="260" y2="273" class="axis" /><circle cx="260" cy="278" r="3.4" fill="white" class="thin"/><text x="260" y="279" font-size="2.8" class="bold" text-anchor="middle">F</text><line x1="60" y1="282" x2="60" y2="290" class="extension" /><line x1="260" y1="282" x2="260" y2="290" class="extension" /><line x1="60" y1="288" x2="260" y2="288" class="dim" /><line x1="59" y1="289" x2="61" y2="287" class="dim" /><line x1="259" y1="289" x2="261" y2="287" class="dim" /><text x="160" y="286.4" font-size="2.6" class="dim halo" text-anchor="middle">10 000</text><line x1="40" y1="295" x2="300" y2="295" class="unknown" /><text x="40" y="305" font-size="3.2" class="bold" text-anchor="start">POD NOSNOU DOSKOU SA NIČ NEPREBERÁ Z ARCHÍVNEJ STATIKY.</text><text x="40" y="315" font-size="3.1" class="" text-anchor="start">Nové zadanie: horný monolit 350 × 600 mm, vnútorné rebrá a doska 150–200 mm; detail ZA-02. Nivelácia, výstuž a nosná skladba zatiaľ neurčené. R0 = 184,200</text><text x="40" y="319.65" font-size="3.1" class="" text-anchor="start">m na ulici; všetky výšky M sú k pôvodnej podlahe modelu.</text><text x="12" y="358" font-size="3.6" class="bold" text-anchor="start">KOORDINÁCIA NOVÝCH KONŠTRUKCIÍ</text><rect x="12" y="367" width="550" height="10" class="thin" fill="#efefef"/><text x="14" y="373" font-size="2.7" class="bold" text-anchor="start">Prvok</text><text x="157" y="373" font-size="2.7" class="bold" text-anchor="start">Záväzný geometrický podklad / chýbajúci návrh</text><rect x="12" y="377" width="550" height="10" class="rule" fill="white"/><text x="14" y="381.5" font-size="2.6" class="" text-anchor="start">Podlaha M0</text><text x="157" y="381.5" font-size="2.6" class="" text-anchor="start">Vodovod a kanalizácia nad nosnou doskou. Podlahové vykurovanie mimo garáže, technickej a sprchy; TZ-01. Bez dodatočných vrtov do dosky.</text><rect x="12" y="387" width="550" height="10" class="rule" fill="white"/><text x="14" y="391.5" font-size="2.6" class="" text-anchor="start">Drevený strop a povala</text><text x="157" y="391.5" font-size="2.6" class="" text-anchor="start">Povala iba na odkladanie, bez betónovej stropnej dosky/nadbetonávky. Skladovacie a bodové zaťaženia musí určiť výpočet. Katedrála 1.03 zostáva otvorená, svetlé výšky 2 750 / 4 850 mm.</text><rect x="12" y="397" width="550" height="10" class="rule" fill="white"/><text x="14" y="401.5" font-size="2.6" class="" text-anchor="start">Nosné línie a základy</text><text x="157" y="401.5" font-size="2.6" class="" text-anchor="start">Nový monolitický návrh podľa ZA-02, geotechniky a reakcií nosnej sústavy. Výstuž, rebrá a pracovné škáry sa nepreberajú zo starého projektu.</text><line x1="12" y1="367" x2="12" y2="407" class="rule" /><line x1="155" y1="367" x2="155" y2="407" class="rule" /><line x1="562" y1="367" x2="562" y2="407" class="rule" /><text x="600" y="370" font-size="3.4" class="bold" text-anchor="start">ZNAČKY A MATERIÁLY</text><rect x="600" y="375" width="10" height="5" class="thin" fill="url(#murivo)"/><text x="614" y="379" font-size="2.7" class="" text-anchor="start">Murivo / keramické prvky</text><rect x="600" y="383" width="10" height="5" class="thin" fill="url(#insulation)"/><text x="614" y="387" font-size="2.7" class="" text-anchor="start">ETICS / minerálna vlna</text><rect x="600" y="391" width="10" height="5" class="thin" fill="url(#concrete)"/><text x="614" y="395" font-size="2.7" class="" text-anchor="start">Betón – len ak je určený návrhom</text><rect x="600" y="399" width="10" height="5" class="thin" fill="url(#timber)"/><text x="614" y="403" font-size="2.7" class="" text-anchor="start">Drevený obklad</text><text x="600" y="415" font-size="2.7" class="" text-anchor="start">Čiarkovane: prerušené / neurčené konštrukcie.</text><text x="600" y="422" font-size="2.7" class="" text-anchor="start">M = výška k podlahe modelu. Dĺžky v mm.</text><text x="600" y="428" font-size="2.7" class="" text-anchor="start">K ulici R0: z = M + ΔFFL. ΔFFL neurčené.</text><text x="12" y="492" font-size="2.7" class="" text-anchor="start">KONTROLA TLAČE 100 % · 1 000 mm = 20 mm na papieri</text><line x1="12" y1="498" x2="32" y2="498" class="heavy" /><line x1="12" y1="495" x2="12" y2="501" class="thin" /><line x1="32" y1="495" x2="32" y2="501" class="thin" /><text x="39" y="499" font-size="2.7" class="" text-anchor="start">1 : 50 · vypnúť „prispôsobiť strane“</text><line x1="12" y1="513" x2="829" y2="513" class="heavy" /><text x="12" y="523" font-size="6" class="bold" text-anchor="start">NOVOSTAVBA RD BŘEZÍ U MIKULOVA</text><text x="12" y="531" font-size="3.6" class="bold" text-anchor="start">PARCELA 6012/26 · HLAVNÝ NÁVRH C / B / B</text><text x="12" y="541" font-size="5" class="bold" text-anchor="start">B-B · Priečny rez katedrálovým stropom</text><text x="12" y="550" font-size="2.6" class="" text-anchor="start">R0 = 184,200 m · M0 = PODLAHA MODELU · ΔFFL = M0 − R0 ZATIAĽ NEURČENÉ</text><text x="12" y="559" font-size="2.8" class="" text-anchor="start">Rozmery nadzemnej architektonickej geometrie z modelu. Základy, nosná skladba podlahy a strechy, vence a krov zostávajú otvorené R01-R04; list nie je realizačný rez.</text><line x1="500" y1="513" x2="500" y2="581" class="thin" /><text x="509" y="522" font-size="2.5" class="muted" text-anchor="start">STAV</text><text x="509" y="530" font-size="4.8" class="bold" text-anchor="start">NEVYDANÉ NA REALIZÁCIU</text><text x="509" y="538" font-size="2.8" class="" text-anchor="start">Chýbajúci návrh sa nesmie nahradiť mierkou výkresu.</text><text x="509" y="549" font-size="2.8" class="" text-anchor="start">VYPRACOVAL: digitálne dvojča · bez autorizačnej pečiatky</text><text x="509" y="557" font-size="2.8" class="" text-anchor="start">DÁTUM 2026-09-16   FORMÁT A1 841 × 594 mm   MIERKA 1 : 50</text><text x="509" y="565" font-size="2.4" class="" text-anchor="start">ZDROJ 4676f56cd888 · úplné odtlačky v model-snapshot.json</text><text x="829" y="578" font-size="6" class="bold" text-anchor="end">D1.1.RE-02</text></svg>