xt-anchor="middle">H6</text><line x1="177.27826810908036" y1="408" x2="370.4782681090804" y2="408" class="extension" /><line x1="177.27826810908036" y1="468" x2="370.4782681090804" y2="468" class="extension" /><line x1="368.4782681090804" y1="408" x2="368.4782681090804" y2="468" class="dim" /><line x1="367.4782681090804" y1="409" x2="369.4782681090804" y2="407" class="dim" /><line x1="367.4782681090804" y1="469" x2="369.4782681090804" y2="467" class="dim" /><g transform="translate(366.7782681090804 438) rotate(-90)"><text x="0" y="0" font-size="2.6" class="dim halo" text-anchor="middle">3 000</text></g></g><text x="12" y="45" font-size="2.7" class="bold" text-anchor="start">ULIČNÁ ČASŤ · nadväzuje SI-02 · prekrytie Y 17 500–21 000 mm</text><text x="706" y="58" font-size="3.2" class="bold" text-anchor="start">PARCELA 6012/26. Uličný aj pravý KOLMÝ odstup 3 000 mm. Jediný</text><text x="706" y="62.8" font-size="3.2" class="bold" text-anchor="start">súradnicový rámec C/B/B.</text><text x="706" y="116" font-size="3" class="" text-anchor="start">Katastrálna hranica a požadované osadenie nie sú geodetické vytýčenie.</text><text x="706" y="120.5" font-size="3" class="" text-anchor="start">Pred stavbou overiť hranice a výškopis.</text><text x="706" y="192" font-size="3.2" class="bold" text-anchor="start">VS1 · NÁVRH VSTUPU</text><text x="706" y="202" font-size="3" class="" text-anchor="start">Pri D2: podesta 1 500 × 1 500 mm v existujúcom prístupe. Čelo Y 1 500;</text><text x="706" y="206.5" font-size="3" class="" text-anchor="start">dvere sa otvárajú dovnútra.</text><text x="706" y="253" font-size="3" class="bold" text-anchor="start">Jeden stupeň h = 150 mm je návrhový cieľ. Výšky podesty a prístupu, spád</text><text x="706" y="257.5" font-size="3" class="bold" text-anchor="start">a prah sú otvorené; výšková väzba ZA-02. Nejde o zameraný ani realizačný</text><text x="706" y="262" font-size="3" class="bold" text-anchor="start">stav.</text><text x="706" y="323" font-size="3" class="" text-anchor="start">Schod je pred podestou. Jeho výška sa meria od miestneho prístupu;</text><text x="706" y="327.5" font-size="3" class="" text-anchor="start">neznamená podlahu 150 mm nad ulicou R0.</text><text x="12" y="492" font-size="2.7" class="" text-anchor="start">KONTROLA TLAČE 100 % · 1 000 mm = 20 mm na papieri</text><line x1="12" y1="498" x2="32" y2="498" class="heavy" /><line x1="12" y1="495" x2="12" y2="501" class="thin" /><line x1="32" y1="495" x2="32" y2="501" class="thin" /><text x="39" y="499" font-size="2.7" class="" text-anchor="start">1 : 50 · vypnúť „prispôsobiť strane“</text><line x1="12" y1="513" x2="829" y2="513" class="heavy" /><text x="12" y="523" font-size="6" class="bold" text-anchor="start">NOVOSTAVBA RD BŘEZÍ U MIKULOVA</text><text x="12" y="531" font-size="3.6" class="bold" text-anchor="start">PARCELA 6012/26 · HLAVNÝ NÁVRH C / B / B</text><text x="12" y="541" font-size="5" class="bold" text-anchor="start">Situácia osadenia · ulica</text><text x="12" y="550" font-size="2.6" class="" text-anchor="start">R0 = 184,200 m · M0 = PODLAHA MODELU · ΔFFL = M0 − R0 ZATIAĽ NEURČENÉ</text><text x="12" y="559" font-size="2.8" class="" text-anchor="start">Rozdelenie na dva nadväzujúce listy zachováva 1:50. Hranice a výškové osadenie treba geodeticky overiť. R05 zostáva otvorený.</text><line x1="500" y1="513" x2="500" y2="581" class="thin" /><text x="509" y="522" font-size="2.5" class="muted" text-anchor="start">STAV</text><text x="509" y="530" font-size="4.8" class="bold" text-anchor="start">NEVYDANÉ NA REALIZÁCIU</text><text x="509" y="538" font-size="2.8" class="" text-anchor="start">Chýbajúci návrh sa nesmie nahradiť mierkou výkresu.</text><text x="509" y="549" font-size="2.8" class="" text-anchor="start">VYPRACOVAL: digitálne dvojča · bez autorizačnej pečiatky</text><text x="509" y="557" font-size="2.8" class="" text-anchor="start">DÁTUM 2026-09-16   FORMÁT A1 841 × 594 mm   MIERKA 1 : 50</text><text x="509" y="565" font-size="2.4" class="" text-anchor="start">ZDROJ 4676f56cd888 · úplné odtlačky v model-snapshot.json</text><text x="829" y="578" font-size="6" class="bold" text-anchor="end">C.SI-01</text></svg>