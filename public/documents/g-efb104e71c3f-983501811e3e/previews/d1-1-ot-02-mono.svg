class="" text-anchor="start">800 / neurčené</text><text x="708.45" y="199.5" font-size="2.6" class="" text-anchor="start">do puzdra / 1.14; posun +X 850 mm</text><line x1="12" y1="59" x2="12" y2="209" class="rule" /><line x1="208.07999999999998" y1="59" x2="208.07999999999998" y2="209" class="rule" /><line x1="346.97" y1="59" x2="346.97" y2="209" class="rule" /><line x1="469.52000000000004" y1="59" x2="469.52000000000004" y2="209" class="rule" /><line x1="600.24" y1="59" x2="600.24" y2="209" class="rule" /><line x1="706.45" y1="59" x2="706.45" y2="209" class="rule" /><line x1="829" y1="59" x2="829" y2="209" class="rule" /><text x="12" y="222" font-size="3.2" class="bold" text-anchor="start">Uvedené rozmery patria otvorom v modeli. Výrobný rozmer rámu, montážna škára, profily, prah, zasklenie, kovanie a požadované vlastnosti zatiaľ nie sú špecifikované. Údaje označené „neurčené“ nemožno odvodiť od oka.</text><text x="12" y="249" font-size="3" class="" text-anchor="start">Orientácia krídel sa preberá z existujúceho pôdorysu; osi, otvory aj kódy sú zachované. Dodávateľ má potvrdiť zárubne, svetlú priechodnosť, výšku prahu a montážne tolerancie, najmä pri H200 a akustických priečkach.</text><text x="12" y="492" font-size="2.7" class="" text-anchor="start">KONTROLA TLAČE 100 % · 1 000 mm = 20 mm na papieri</text><line x1="12" y1="498" x2="32" y2="498" class="heavy" /><line x1="12" y1="495" x2="12" y2="501" class="thin" /><line x1="32" y1="495" x2="32" y2="501" class="thin" /><text x="39" y="499" font-size="2.7" class="" text-anchor="start">1 : 50 · vypnúť „prispôsobiť strane“</text><line x1="12" y1="513" x2="829" y2="513" class="heavy" /><text x="12" y="523" font-size="6" class="bold" text-anchor="start">NOVOSTAVBA RD BŘEZÍ U MIKULOVA</text><text x="12" y="531" font-size="3.6" class="bold" text-anchor="start">PARCELA 6012/26 · HLAVNÝ NÁVRH C / B / B</text><text x="12" y="541" font-size="5" class="bold" text-anchor="start">Výpis vnútorných dverí</text><text x="12" y="550" font-size="2.6" class="" text-anchor="start">R0 = 184,200 m · M0 = PODLAHA MODELU · ΔFFL = M0 − R0 ZATIAĽ NEURČENÉ</text><text x="12" y="559" font-size="2.8" class="" text-anchor="start">R09: modelový výpis je koordinovaný s pôdorysom, výrobná špecifikácia nie je uzavretá. O11 pridáva chýbajúci horný svetlík.</text><line x1="500" y1="513" x2="500" y2="581" class="thin" /><text x="509" y="522" font-size="2.5" class="muted" text-anchor="start">STAV</text><text x="509" y="530" font-size="4.8" class="bold" text-anchor="start">NEVYDANÉ NA REALIZÁCIU</text><text x="509" y="538" font-size="2.8" class="" text-anchor="start">Chýbajúci návrh sa nesmie nahradiť mierkou výkresu.</text><text x="509" y="549" font-size="2.8" class="" text-anchor="start">VYPRACOVAL: digitálne dvojča · bez autorizačnej pečiatky</text><text x="509" y="557" font-size="2.8" class="" text-anchor="start">DÁTUM 2026-09-16   FORMÁT A1 841 × 594 mm   MIERKA tabuľka</text><text x="509" y="565" font-size="2.4" class="" text-anchor="start">ZDROJ 4676f56cd888 · úplné odtlačky v model-snapshot.json</text><text x="829" y="578" font-size="6" class="bold" text-anchor="end">D1.1.OT-02</text></svg>